[project]
name = "evalcrest"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "yahiatamernour@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "langchain-anthropic>=1.7.7",
    "langchain-core>=1.7.1",
    "langgraph>=1.2.18",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2.1.6",
    "structlog>=26.1.0",
    "typer>=0.27.3",
]

[project.scripts]
evalcrest = "evalcrest:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "respx>=0.23.1",
    "ruff>=0.17.3",
]
